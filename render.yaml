# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Render's disk is wiped on every deploy, so the hosted service needs a real
# PostgreSQL: create one on Render (or Supabase) and paste its URL as DATABASE_URL.
# Render web services accept HTTPS only: raw TCP GPS trackers (GT06, Teltonika)
# need a VPS, or a Traccar server forwarding to /api/gps/webhook (docs/GPS_TRACKERS.md).
services:
  - type: web
    name: crescent-transit
    runtime: node
    plan: free
    # Dev dependencies (Vite) are needed to build the web app even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Live mode: no demo accounts or demo tools (docs/GO_LIVE.md).
      - key: DEMO_MODE
        value: "0"
      # The first administrator's password (10+ characters), used once on the empty database.
      - key: ADMIN_PASSWORD
        sync: false
      # Students' university email (the one on DigiiCampus) and the emailed codes.
      - key: STUDENT_EMAIL_DOMAIN
        sync: false
      - key: STUDENT_EMAIL_VERIFY
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      # Who is told when something goes wrong, and an offsite copy of the backups
      # (this server's disk is wiped on every deploy; docs/GO_LIVE.md).
      - key: ALERT_EMAIL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: BACKUP_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
